name: Public Results Export

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum Issues, PRs, and workflow runs to export"
        required: false
        default: "500"
      commit_results:
        description: "Commit public results, generated comparison dashboards, and generated history page to the current branch"
        required: false
        default: "true"
  push:
    branches:
      - main
    paths-ignore:
      - "data/public-results.json"
      - "data/public-results.md"
      - "lab/comparisons/**"
      - "lab/history/**"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: public-results-export
  cancel-in-progress: true

jobs:
  public-results-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch public repository data
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/public-results data
          limit="${INPUT_LIMIT:-500}"
          if [ -z "$limit" ]; then limit=500; fi
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          OWNER="$owner" REPO="$repo" EXPORT_LIMIT="$limit" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path
          from typing import Any

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          total_limit = int(os.environ.get("EXPORT_LIMIT") or "500")
          page_size = min(100, max(1, total_limit))

          ISSUE_QUERY = r'''
          query($owner: String!, $repo: String!, $first: Int!, $cursor: String) {
            repository(owner: $owner, name: $repo) {
              issues(first: $first, after: $cursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number
                  title
                  body
                  state
                  url
                  createdAt
                  updatedAt
                  closedAt
                  author { login }
                  labels(first: 50) { nodes { name } }
                  reactionGroups { content users { totalCount } }
                  comments { totalCount }
                }
              }
            }
          }
          '''

          PR_QUERY = r'''
          query($owner: String!, $repo: String!, $first: Int!, $cursor: String) {
            repository(owner: $owner, name: $repo) {
              pullRequests(first: $first, after: $cursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number
                  title
                  body
                  state
                  url
                  createdAt
                  updatedAt
                  closedAt
                  mergedAt
                  author { login }
                  mergedBy { login }
                  baseRefName
                  headRefName
                  headRefOid
                  mergeCommit { oid }
                  labels(first: 50) { nodes { name } }
                  reactionGroups { content users { totalCount } }
                  comments { totalCount }
                  changedFiles
                  additions
                  deletions
                  reviewDecision
                  files(first: 100) { nodes { path additions deletions } }
                }
              }
            }
          }
          '''

          def run_graphql(query: str, cursor: str | None) -> dict[str, Any]:
              args = [
                  "gh",
                  "api",
                  "graphql",
                  "-f",
                  f"owner={owner}",
                  "-f",
                  f"repo={repo}",
                  "-F",
                  f"first={page_size}",
                  "-f",
                  f"query={query}",
              ]
              if cursor:
                  args.extend(["-f", f"cursor={cursor}"])
              result = subprocess.run(args, check=True, text=True, capture_output=True)
              return json.loads(result.stdout)

          def fetch_connection(query: str, key: str) -> list[dict[str, Any]]:
              nodes: list[dict[str, Any]] = []
              cursor: str | None = None
              while len(nodes) < total_limit:
                  raw = run_graphql(query, cursor)
                  connection = raw["data"]["repository"][key]
                  page_nodes = connection.get("nodes") or []
                  nodes.extend(page_nodes)
                  page_info = connection.get("pageInfo") or {}
                  if not page_info.get("hasNextPage"):
                      break
                  cursor = page_info.get("endCursor")
                  if not cursor:
                      break
              return nodes[:total_limit]

          issues = fetch_connection(ISSUE_QUERY, "issues")
          prs = fetch_connection(PR_QUERY, "pullRequests")

          out = Path(".tmp/public-results")
          out.mkdir(parents=True, exist_ok=True)
          (out / "issues.json").write_text(json.dumps(issues, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          (out / "pull-requests.json").write_text(json.dumps(prs, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"exported issues: {len(issues)}")
          print(f"exported pull requests: {len(prs)}")
          PY

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit "$limit" \
            --json databaseId,name,workflowName,displayTitle,event,status,conclusion,createdAt,updatedAt,headBranch,headSha,url \
            > .tmp/public-results/workflow-runs.json

          gh label list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 200 \
            --json name,color,description \
            > .tmp/public-results/labels.json

      - name: Build public results export
        run: |
          python scripts/build_public_results_export.py \
            --issues .tmp/public-results/issues.json \
            --prs .tmp/public-results/pull-requests.json \
            --workflow-runs .tmp/public-results/workflow-runs.json \
            --labels .tmp/public-results/labels.json \
            --runs-dir runs \
            --out-json data/public-results.json \
            --out-md data/public-results.md

      - name: Build comparison dashboards
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          import sys
          from pathlib import Path

          data = json.loads(Path('data/public-results.json').read_text(encoding='utf-8'))
          weeks = sorted({
              label.split(':', 1)[1]
              for issue in data.get('issues', [])
              for label in issue.get('labels', [])
              if isinstance(label, str) and label.startswith('week:')
          })
          if not weeks:
              print('No week labels found; skipping comparison dashboard generation.')
          for week_id in weeks:
              out_dir = Path('lab') / 'comparisons' / week_id
              print(f'Building comparison dashboard for {week_id} -> {out_dir}')
              subprocess.run(
                  [
                      sys.executable,
                      'scripts/build_comparison_dashboard.py',
                      '--public-results',
                      'data/public-results.json',
                      '--week-id',
                      week_id,
                      '--out-dir',
                      str(out_dir),
                  ],
                  check=True,
              )
          PY

      - name: Build history page
        run: |
          python scripts/build_history_page.py \
            --public-results data/public-results.json \
            --out-dir lab/history

      - name: Upload public results artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-results-export-${{ github.run_number }}
          path: |
            data/public-results.json
            data/public-results.md
            lab/comparisons/**
            lab/history/**
            .tmp/public-results
          if-no-files-found: error

      - name: Commit public results snapshot
        env:
          INPUT_COMMIT_RESULTS: ${{ inputs.commit_results }}
        run: |
          set -euo pipefail
          commit_results="${INPUT_COMMIT_RESULTS:-true}"
          if [ "$commit_results" != "true" ]; then
            echo "commit_results is not true; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-results.json data/public-results.md lab/comparisons lab/history
          if git diff --cached --quiet; then
            echo "No public results, comparison dashboard, or history changes to commit."
            exit 0
          fi
          git commit -m "Update public results export"
          git push