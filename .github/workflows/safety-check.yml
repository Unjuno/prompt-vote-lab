name: Safety Check

on:
  pull_request:
    branches: ["main"]
    paths:
      - "lab/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run shared safety check
        run: bash scripts/safety-check.sh origin/${{ github.base_ref }} HEAD
