name: Script Check

on:
  pull_request:
    paths:
      - "scripts/**/*.mjs"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "tests/fixtures/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/script-check.yml"
      - ".github/workflows/support-unlock-export.yml"
      - ".github/workflows/issue-safety-scan.yml"
      - ".github/workflows/public-results-export.yml"
      - ".github/workflows/weekly-issue-finalizer.yml"
      - ".github/workflows/codex-first-canary-run.yml"
      - ".github/workflows/codex-isolated-3file-canary-run.yml"
      - ".github/workflows/codex-isolated-3file-relaxed-canary-run.yml"
      - ".github/workflows/codex-writeback-canary-run.yml"
      - ".github/workflows/codex-offline-json-canary-run.yml"
      - ".github/workflows/codex-agent-observed-canary-run.yml"
      - ".github/workflows/canary-007-policy-feasibility.yml"
      - ".github/workflows/codex-policy-agent-canary-run.yml"
      - ".github/workflows/codex-task-packet-canary-run.yml"
      - ".github/workflows/codex-fixed-issue-instruction-canary-run.yml"
      - "README.md"
      - "data/public-results.json"
      - "data/public-results.md"
      - "data/support-unlocks/**"
      - "lab/comparisons/**"
      - "docs/codex-runner-contract.md"
      - "docs/canary-log-policy.md"
      - "docs/current-codex-implementation-path.md"
      - "docs/public-results-export.md"
      - "docs/public-agent-run-bundle.md"
      - "docs/issue-lifecycle.md"
      - "docs/comparison-dashboard.md"
      - "docs/support-policy.md"
      - "docs/canary-007-policy-enforced-agent.md"
      - "docs/canary-008-selected-prompt-task-packet.md"
      - "docs/canary-009-selected-issue-instructions.md"
      - "docs/usable-experiment-ops.md"
      - "rules/model-policy-v1.1.md"
      - "runs/first-canary-009-authorized-canary-issue-170-success.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=(scripts/*.mjs scripts/**/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .mjs scripts found."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check Python syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=(scripts/*.py scripts/**/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .py scripts found."
            exit 0
          fi
          python -m py_compile "${files[@]}"

      - name: Check shell script syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .sh scripts found."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            bash -n "$file"
          done

      - name: Run offline workflow smoke test
        run: node scripts/smoke-test-workflows.mjs

      - name: Run evidence artifact smoke test
        run: node scripts/run-evidence-artifact-smoke.mjs

      - name: Run pre-API freeze audit self-test
        run: python scripts/test_pre_api_freeze_audit.py

      - name: Run validator audit test
        run: python scripts/test_dry_run_validator_audit.py

      - name: Run canary policy alignment test
        run: python scripts/test_canary_policy_alignment.py

      - name: Run Codex canary contract test
        run: python scripts/test_codex_canary_contract.py

      - name: Run canary log policy test
        run: python scripts/test_canary_log_policy.py

      - name: Run canary diagnostics collector test
        run: python scripts/test_collect_canary_diagnostics.py

      - name: Run Codex writeback patch applier test
        run: python scripts/test_apply_codex_writeback_patch.py

      - name: Run offline JSON applier test
        run: python scripts/test_apply_codex_offline_json.py

      - name: Run current Codex path doc test
        run: python scripts/test_current_codex_path_doc.py

      - name: Run usable experiment ops doc test
        run: python scripts/test_usable_experiment_ops_doc.py

      - name: Run public results export builder test
        run: python scripts/test_build_public_results_export.py

      - name: Run public results export workflow contract test
        run: python scripts/test_public_results_export_workflow_contract.py

      - name: Run script-check workflow contract test
        run: python scripts/test_script_check_workflow_contract.py

      - name: Run support unlock builder test
        run: python scripts/test_build_support_unlocks.py

      - name: Run support unlock smoke test
        run: python scripts/test_unlock_export_public.py

      - name: Run public agent run bundle builder test
        run: python scripts/test_build_public_agent_run_bundle.py

      - name: Run comparison dashboard builder test
        run: python scripts/test_build_comparison_dashboard.py

      - name: Run comparison dashboard decision test
        run: python scripts/test_comparison_dashboard_decision.py

      - name: Run generated comparison dashboard test
        run: python scripts/test_generated_comparison_dashboards.py

      - name: Run weekly Issue finalizer test
        run: python scripts/test_weekly_issue_finalizer.py

      - name: Run weekly Issue finalizer workflow contract test
        run: python scripts/test_weekly_issue_finalizer_workflow_contract.py

      - name: Run prompt issue template contract test
        run: python scripts/test_prompt_issue_template_contract.py

      - name: Run task packet generator test
        run: python scripts/test_create_codex_task_packet.py

      - name: Run task packet runner contract test
        run: python scripts/test_task_packet_runner_contract.py

      - name: Run fixed Issue instruction packet generator test
        run: python scripts/test_create_codex_issue_instruction_packet.py

      - name: Run fixed Issue instruction runner contract test
        run: python scripts/test_issue_instruction_runner_contract.py

      - name: Run Issue safety scan test
        run: python scripts/test_scan_issue_safety.py

      - name: Run Issue safety workflow contract test
        run: python scripts/test_issue_safety_workflow_contract.py

      - name: Run Issue execution gate test
        run: python scripts/test_check_issue_execution_gate.py

      - name: Run terminal metadata extraction test
        run: python scripts/test_extract_pr_metadata.py

      - name: Run public run log writer test
        run: python scripts/test_write_public_run_log.py

      - name: Run weekly no-eligible selector test
        run: python scripts/test_weekly_auto_no_eligible.py

      - name: Run lab PR scope guard self-test
        run: bash scripts/test-lab-pr-scope.sh
