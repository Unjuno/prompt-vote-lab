name: Lean Proof Test

on:
  pull_request:
    paths:
      - "formal/**/*.lean"
      - "lean-toolchain"
      - ".github/workflows/lean-proof-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: |
          lean --version

      - name: Check selection proof
        run: |
          lean formal/Selection.lean
