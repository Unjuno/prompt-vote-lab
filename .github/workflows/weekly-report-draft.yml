name: Weekly Report Draft

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week label, for example week-2026-W18"
        required: true
        type: string
      selected_prompt:
        description: "Selected prompt text or short candidate description"
        required: true
        type: string
      issue_number:
        description: "Related prompt issue number"
        required: false
        default: "unrecorded"
        type: string
      pr_number:
        description: "Related implementation PR number"
        required: false
        default: "unrecorded"
        type: string
      candidate_rank:
        description: "Candidate rank"
        required: false
        default: "unrecorded"
        type: string
      vote_count:
        description: "Selected candidate vote count"
        required: false
        default: "unrecorded"
        type: string
      baseline_votes:
        description: "No-change baseline votes"
        required: false
        default: "20"
        type: string
      outcome:
        description: "Outcome, for example merged, rejected, failed, unsafe, partial, no-change"
        required: false
        default: "Unknown"
        type: string
      expectation_gap:
        description: "Hit, Partial, Misread, Overbuild, Underbuild, Rule conflict, Unsafe, Rejected, or Unknown"
        required: false
        default: "Unknown"
        type: choice
        options:
          - Hit
          - Partial
          - Misread
          - Overbuild
          - Underbuild
          - Rule conflict
          - Unsafe
          - Rejected
          - Unknown
      run_reason:
        description: "normal-weekly-run, support-unlocked-run, no-change, manual-review, etc."
        required: false
        default: "manual-report-draft"
        type: string
      reputation_memory:
        description: "Qualitative note about what players should remember. No numeric scores."
        required: false
        default: "No automated trust rating is computed. Players should use this public outcome as qualitative memory for future votes."
        type: string
      vote_summary_path:
        description: "Optional repository path to vote summary markdown"
        required: false
        default: ""
        type: string
      implementation_summary_path:
        description: "Optional repository path to implementation summary markdown"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-report-draft-${{ inputs.week }}
  cancel-in-progress: false

jobs:
  draft-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export report inputs
        env:
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_SELECTED_PROMPT: ${{ inputs.selected_prompt }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_CANDIDATE_RANK: ${{ inputs.candidate_rank }}
          INPUT_VOTE_COUNT: ${{ inputs.vote_count }}
          INPUT_BASELINE_VOTES: ${{ inputs.baseline_votes }}
          INPUT_OUTCOME: ${{ inputs.outcome }}
          INPUT_EXPECTATION_GAP: ${{ inputs.expectation_gap }}
          INPUT_RUN_REASON: ${{ inputs.run_reason }}
          INPUT_REPUTATION_MEMORY: ${{ inputs.reputation_memory }}
          INPUT_VOTE_SUMMARY_PATH: ${{ inputs.vote_summary_path }}
          INPUT_IMPLEMENTATION_SUMMARY_PATH: ${{ inputs.implementation_summary_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          mapping = {
              'PVL_WEEK': 'INPUT_WEEK',
              'PVL_SELECTED_PROMPT': 'INPUT_SELECTED_PROMPT',
              'PVL_ISSUE_NUMBER': 'INPUT_ISSUE_NUMBER',
              'PVL_PR_NUMBER': 'INPUT_PR_NUMBER',
              'PVL_CANDIDATE_RANK': 'INPUT_CANDIDATE_RANK',
              'PVL_VOTE_COUNT': 'INPUT_VOTE_COUNT',
              'PVL_BASELINE_VOTES': 'INPUT_BASELINE_VOTES',
              'PVL_OUTCOME': 'INPUT_OUTCOME',
              'PVL_EXPECTATION_GAP': 'INPUT_EXPECTATION_GAP',
              'PVL_RUN_REASON': 'INPUT_RUN_REASON',
              'PVL_REPUTATION_MEMORY': 'INPUT_REPUTATION_MEMORY',
              'PVL_VOTE_SUMMARY_PATH': 'INPUT_VOTE_SUMMARY_PATH',
              'PVL_IMPLEMENTATION_SUMMARY_PATH': 'INPUT_IMPLEMENTATION_SUMMARY_PATH',
          }

          lines = []
          for target, source in mapping.items():
              value = os.environ.get(source, '')
              delimiter = f'EOF_{target}'
              while delimiter in value:
                  delimiter += '_X'
              lines.append(f'{target}<<{delimiter}')
              lines.append(value)
              lines.append(delimiter)
          Path(os.environ['GITHUB_ENV']).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Draft report
        run: |
          python scripts/draft_weekly_report.py \
            --week "$PVL_WEEK" \
            --selected-prompt "$PVL_SELECTED_PROMPT" \
            --issue-number "$PVL_ISSUE_NUMBER" \
            --pr-number "$PVL_PR_NUMBER" \
            --candidate-rank "$PVL_CANDIDATE_RANK" \
            --vote-count "$PVL_VOTE_COUNT" \
            --baseline-votes "$PVL_BASELINE_VOTES" \
            --outcome "$PVL_OUTCOME" \
            --expectation-gap "$PVL_EXPECTATION_GAP" \
            --run-reason "$PVL_RUN_REASON" \
            --vote-summary "$PVL_VOTE_SUMMARY_PATH" \
            --implementation-summary "$PVL_IMPLEMENTATION_SUMMARY_PATH" \
            --reputation-memory "$PVL_REPUTATION_MEMORY"

      - name: Check report policy boundaries
        run: |
          # Permit negative statements such as "not computed" or "does not compute".
          # Block affirmative claims that the report created an automated rating system.
          if grep -R -n -i -E "\b(computed|assigned|awarded|updated|generated)\b.*\b(trust rating|trust score|author rating|author score|player score|reputation score|leaderboard|automatic penalty)\b|\b(leaderboard placement|automatic penalty)\b.*\b(computed|assigned|awarded|updated|generated)\b" runs/*-report.md; then
            echo "ERROR: report draft must not claim automated scoring, penalties, or leaderboard state."
            exit 1
          fi

      - name: Create report draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          safe_week=$(printf '%s' "$PVL_WEEK" | tr -c 'A-Za-z0-9._-' '-')
          branch="report-draft-${safe_week}-${{ github.run_number }}"
          report_path="runs/${PVL_WEEK}-report.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$report_path"
          git commit -m "Draft weekly report for ${PVL_WEEK}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Draft weekly report for ${PVL_WEEK}" \
            --body "Creates a model-free weekly report draft. This PR does not publish externally and does not compute automated trust ratings." \
            --base main \
            --head "$branch"
