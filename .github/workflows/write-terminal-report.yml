name: Write Terminal Report

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week label, for example week-001"
        required: true
        type: string
      candidate_rank:
        description: "Candidate rank"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      issue_number:
        description: "Selected prompt issue number"
        required: true
        type: string
      vote_count:
        description: "Vote count"
        required: false
        type: string
      prompt:
        description: "Selected prompt"
        required: true
        type: string
      pr:
        description: "Implementation PR URL or number"
        required: false
        default: "unrecorded"
        type: string
      state:
        description: "Terminal run state"
        required: true
        type: choice
        options:
          - merged
          - rejected
          - unsafe
          - failed
          - no-change
      safety:
        description: "Safety-check result"
        required: false
        default: "unrecorded"
        type: string
      changed_files:
        description: "Changed files summary"
        required: false
        default: "unrecorded"
        type: string
      notes:
        description: "Recorded notes"
        required: false
        default: "unrecorded"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  write-terminal-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write deterministic report
        run: |
          python scripts/write_terminal_report.py \
            --week "${{ inputs.week }}" \
            --candidate-rank "${{ inputs.candidate_rank }}" \
            --issue-number "${{ inputs.issue_number }}" \
            --vote-count "${{ inputs.vote_count }}" \
            --prompt "${{ inputs.prompt }}" \
            --pr "${{ inputs.pr }}" \
            --state "${{ inputs.state }}" \
            --safety "${{ inputs.safety }}" \
            --changed-files "${{ inputs.changed_files }}" \
            --notes "${{ inputs.notes }}"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "terminal-report-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"
          git add docs/reports/
          git commit -m "Write terminal report for ${{ inputs.week }} rank ${{ inputs.candidate_rank }}"
          git push --set-upstream origin "terminal-report-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"

      - name: Open report PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Write terminal report for ${{ inputs.week }} rank ${{ inputs.candidate_rank }}" \
            --body "Adds a deterministic terminal run report. This workflow does not call the OpenAI API." \
            --base main \
            --head "terminal-report-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"
