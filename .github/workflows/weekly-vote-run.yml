name: Weekly Vote Run

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week label, for example week-001"
        required: true
        type: string
      support_usd:
        description: "Manual weekly support total in USD, while Sponsors approval is pending"
        required: true
        default: "0"
        type: string
      no_change_baseline:
        description: "Virtual no-change baseline votes inserted every week"
        required: true
        default: "20"
        type: string
      run_implementation:
        description: "Call the paid implementation API for eligible ranks"
        required: true
        default: false
        type: boolean
      confirm_paid_api_run:
        description: "Type RUN_GPT5_NANO to confirm paid API runs when run_implementation is true"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: weekly-vote-${{ inputs.week }}
  cancel-in-progress: false

jobs:
  collect-votes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect prompt proposal votes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/collect_votes.py \
            --repo "${{ github.repository }}" \
            --week "${{ inputs.week }}" \
            --out-dir .tmp \
            --no-change-baseline "${{ inputs.no_change_baseline }}"

      - name: Determine eligible ranks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          support = float("${{ inputs.support_usd }}" or "0")
          candidates = json.loads(Path('.tmp/weekly-candidates.json').read_text())
          eligible = []
          for c in candidates:
              if c.get('candidate_type') == 'no-change-baseline':
                  continue
              rank = int(c['rank'])
              if rank == 1:
                  c['run_reason'] = 'normal-weekly-run'
                  eligible.append(c)
              elif rank == 2 and support >= 5:
                  c['run_reason'] = 'support-unlocked-run'
                  eligible.append(c)
              elif rank == 3 and support >= 10:
                  c['run_reason'] = 'support-unlocked-run'
                  eligible.append(c)
          Path('.tmp/eligible-candidates.json').write_text(json.dumps(eligible, indent=2), encoding='utf-8')
          print(json.dumps(eligible, indent=2))
          PY

      - name: Write weekly vote report
        run: |
          mkdir -p "runs"
          cp .tmp/weekly-vote-summary.md "runs/${{ inputs.week }}-vote-summary.md"
          {
            echo ""
            echo "## Manual weekly support total"
            echo ""
            echo "${{ inputs.support_usd }} USD"
            echo ""
            echo "## No-change baseline"
            echo ""
            echo "${{ inputs.no_change_baseline }} virtual votes"
            echo ""
            echo "## Eligible implementation ranks"
            echo ""
            python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('.tmp/eligible-candidates.json').read_text())
          if not items:
              print('- no implementation run: no prompt beat the no-change baseline')
          for item in items:
              print(f"- rank {item['rank']}: issue #{item['issue_number']} ({item['run_reason']})")
          PY
          } >> "runs/${{ inputs.week }}-vote-summary.md"

      - name: Commit vote report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "weekly-vote-${{ inputs.week }}-${{ github.run_number }}"
          git add "runs/${{ inputs.week }}-vote-summary.md"
          git commit -m "Record vote summary for ${{ inputs.week }}"
          git push --set-upstream origin "weekly-vote-${{ inputs.week }}-${{ github.run_number }}"

      - name: Open vote summary PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Record vote summary for ${{ inputs.week }}" \
            --body "Records the weekly vote summary, no-change baseline, and eligible ranks." \
            --base main \
            --head "weekly-vote-${{ inputs.week }}-${{ github.run_number }}"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-candidates-${{ inputs.week }}
          path: |
            .tmp/weekly-candidates.json
            .tmp/eligible-candidates.json
            .tmp/weekly-vote-summary.md

  implementation-runs:
    needs: collect-votes
    if: ${{ inputs.run_implementation }}
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit paid-run confirmation
        run: |
          if [ "${{ inputs.confirm_paid_api_run }}" != "RUN_GPT5_NANO" ]; then
            echo "Refusing to call the API. Set confirm_paid_api_run to RUN_GPT5_NANO."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: weekly-candidates-${{ inputs.week }}
          path: .tmp

      - name: Stop if no prompt beat the baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('.tmp/eligible-candidates.json').read_text())
          if not items:
              print('No eligible prompt candidates. No API call will be made.')
              raise SystemExit(0)
          PY

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY_PRIMARY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_IMPLEMENTATION: ${{ secrets.OPENAI_IMPLEMENTATION_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY_PRIMARY}" ] && [ -z "${OPENAI_API_KEY_IMPLEMENTATION}" ]; then
            echo "No implementation API key found. Add OPENAI_API_KEY or OPENAI_IMPLEMENTATION_API_KEY."
            exit 1
          fi

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Create implementation PRs for eligible candidates
        env:
          OPENAI_API_KEY_PRIMARY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_IMPLEMENTATION: ${{ secrets.OPENAI_IMPLEMENTATION_API_KEY }}
          IMPLEMENTATION_MODEL: gpt-5-nano
          MAX_OUTPUT_TOKENS: "12000"
          GH_TOKEN: ${{ github.token }}
        run: |
          export OPENAI_API_KEY="${OPENAI_API_KEY_PRIMARY:-$OPENAI_API_KEY_IMPLEMENTATION}"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          week = "${{ inputs.week }}"
          run_number = "${{ github.run_number }}"
          candidates = json.loads(Path('.tmp/eligible-candidates.json').read_text())
          if not candidates:
              print('No eligible candidates to implement')
              raise SystemExit(0)

          def sh(cmd):
              print('+', ' '.join(cmd))
              subprocess.run(cmd, check=True)

          for item in candidates:
              rank = str(item['rank'])
              branch = f"codex-lab-{week}-rank-{rank}-{run_number}"
              issue = str(item['issue_number'])
              votes = str(item['vote_count'])
              prompt = item['body']
              reason = item.get('run_reason', 'normal-weekly-run')

              sh(['git', 'checkout', 'main'])
              sh(['git', 'checkout', '-B', branch])
              sh([
                  'python', 'scripts/openai_lab_run.py',
                  '--week', week,
                  '--candidate-rank', rank,
                  '--issue-number', issue,
                  '--voted-prompt', prompt,
                  '--vote-count', votes,
                  '--run-reason', reason,
              ])
              sh(['bash', 'scripts/safety-check.sh', 'origin/main', 'HEAD'])
              diff = subprocess.run(['git', 'diff', '--quiet', '--', 'lab/'])
              if diff.returncode == 0:
                  raise SystemExit(f'Rank {rank} produced no lab changes')
              sh(['git', 'config', 'user.name', 'github-actions[bot]'])
              sh(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
              sh(['git', 'add', 'lab/'])
              sh(['git', 'commit', '-m', f'Run gpt-5-nano lab experiment for {week} rank {rank}'])
              sh(['git', 'push', '--set-upstream', 'origin', branch])

              body_path = Path(f'.tmp/pr-body-rank-{rank}.md')
              summary_path = Path('.tmp/implementation-summary.md')
              body = [
                  'Implements the selected ranked prompt candidate with the fixed implementation model.',
                  '',
                  '## Candidate',
                  '',
                  f'- Week: {week}',
                  f'- Rank: {rank}',
                  f'- Issue: #{issue}',
                  f'- Votes: {votes}',
                  f'- Run reason: {reason}',
                  '- Implementation model: `gpt-5-nano`',
                  '- Model policy: `rules/model-policy-v1.0.md`',
                  '- Paid API run confirmation: recorded by Weekly Vote Run',
                  '',
                  '## Selected prompt',
                  '',
                  prompt,
                  '',
                  '## Implementation summary',
                  '',
                  summary_path.read_text() if summary_path.exists() else 'Implementation summary was not written.',
                  '',
                  '## Merge policy',
                  '',
                  'Rank 1 is the default mainline candidate. Rank 2 and rank 3 are comparison candidates.',
              ]
              body_path.write_text('\n'.join(body), encoding='utf-8')
              sh([
                  'gh', 'pr', 'create',
                  '--title', f'Codex lab run for {week} rank {rank}',
                  '--body-file', str(body_path),
                  '--base', 'main',
                  '--head', branch,
              ])
          PY
