name: Create Run Package

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week label, for example week-001"
        required: true
        type: string
      candidate_rank:
        description: "Candidate rank in the weekly vote, for example 1, 2, or 3"
        required: true
        default: "1"
        type: string
      issue_number:
        description: "Selected prompt issue number"
        required: false
        type: string
      voted_prompt:
        description: "Selected voted prompt"
        required: true
        type: string
      vote_count:
        description: "Vote count for the selected candidate"
        required: false
        type: string
      selection_note:
        description: "Why this candidate is being packaged now"
        required: false
        default: "Selected for this run. Other top-ranked candidates may be executed later."
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-run-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch
        run: |
          git checkout -b "run-package-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"

      - name: Create run prompt package
        run: |
          mkdir -p run-packages
          cat > "run-packages/${{ inputs.week }}-rank-${{ inputs.candidate_rank }}.md" <<'EOF'
          # Prompt Vote Lab Run Package

          ## Week

          ${{ inputs.week }}

          ## Selected candidate

          - Rank: ${{ inputs.candidate_rank }}
          - Issue: #${{ inputs.issue_number }}
          - Vote count: ${{ inputs.vote_count }}

          ## Selection note

          ${{ inputs.selection_note }}

          ## Rule profile

          Use `rules/static-ui-v1.0.md`.

          ## Voted prompt

          ${{ inputs.voted_prompt }}

          ## Required implementation behavior

          - Edit only `lab/`.
          - Use only HTML, CSS, and vanilla JavaScript.
          - Do not change rules, workflows, docs, README, LICENSE, or run logs.
          - Open a pull request for review.
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-packages/
          git commit -m "Create run package for ${{ inputs.week }} rank ${{ inputs.candidate_rank }}"

      - name: Push branch
        run: |
          git push --set-upstream origin "run-package-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Create run package for ${{ inputs.week }} rank ${{ inputs.candidate_rank }}" \
            --body "This PR creates a run package for a selected ranked prompt candidate. It does not run the AI agent automatically. Other top-ranked candidates may be packaged and executed later." \
            --base main \
            --head "run-package-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"
