name: Lab PR Scope Check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lab-pr-scope-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check lab PR scope
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: bash scripts/check-lab-pr-scope.sh
