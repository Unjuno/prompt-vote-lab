name: Codex Lab Run

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week label, for example week-001"
        required: true
        type: string
      candidate_rank:
        description: "Candidate rank"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      issue_number:
        description: "Selected prompt issue number"
        required: true
        type: string
      voted_prompt:
        description: "Selected voted prompt"
        required: true
        type: string
      vote_count:
        description: "Vote count for this candidate"
        required: false
        type: string
      run_reason:
        description: "Run reason"
        required: false
        default: "normal-weekly-run"
        type: choice
        options:
          - normal-weekly-run
          - support-unlocked-run
      confirm_paid_api_run:
        description: "Type RUN_GPT5_NANO to confirm this paid API run"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-lab-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}
  cancel-in-progress: false

jobs:
  codex-lab-run:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit paid-run confirmation
        run: |
          if [ "${{ inputs.confirm_paid_api_run }}" != "RUN_GPT5_NANO" ]; then
            echo "Refusing to call the API. Set confirm_paid_api_run to RUN_GPT5_NANO."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY_PRIMARY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_IMPLEMENTATION: ${{ secrets.OPENAI_IMPLEMENTATION_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY_PRIMARY}" ] && [ -z "${OPENAI_API_KEY_IMPLEMENTATION}" ]; then
            echo "No implementation API key found. Add OPENAI_API_KEY or OPENAI_IMPLEMENTATION_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create branch
        run: |
          git checkout -b "codex-lab-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Run implementation model
        env:
          OPENAI_API_KEY_PRIMARY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_IMPLEMENTATION: ${{ secrets.OPENAI_IMPLEMENTATION_API_KEY }}
          IMPLEMENTATION_MODEL: gpt-5-nano
          MAX_OUTPUT_TOKENS: "12000"
        run: |
          export OPENAI_API_KEY="${OPENAI_API_KEY_PRIMARY:-$OPENAI_API_KEY_IMPLEMENTATION}"
          python scripts/openai_lab_run.py \
            --week "${{ inputs.week }}" \
            --candidate-rank "${{ inputs.candidate_rank }}" \
            --issue-number "${{ inputs.issue_number }}" \
            --voted-prompt "${{ inputs.voted_prompt }}" \
            --vote-count "${{ inputs.vote_count }}" \
            --run-reason "${{ inputs.run_reason }}"

      - name: Run safety check
        run: bash scripts/safety-check.sh origin/main HEAD

      - name: Fail if implementation made no lab changes
        run: |
          if git diff --quiet -- lab/; then
            echo "Implementation completed but did not modify lab/."
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/
          git commit -m "Run gpt-5-nano lab experiment for ${{ inputs.week }} rank ${{ inputs.candidate_rank }}"

      - name: Push branch
        run: |
          git push --set-upstream origin "codex-lab-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body_file=".tmp/pr-body.md"
          mkdir -p .tmp
          cat > "$body_file" <<'EOF'
          Implements the selected ranked prompt candidate with the fixed implementation model.

          ## Candidate

          - Week: ${{ inputs.week }}
          - Rank: ${{ inputs.candidate_rank }}
          - Issue: #${{ inputs.issue_number }}
          - Votes: ${{ inputs.vote_count }}
          - Run reason: ${{ inputs.run_reason }}
          - Implementation model: `gpt-5-nano`
          - Model policy: `rules/model-policy-v1.0.md`
          - Paid API run confirmation: recorded

          ## Selected prompt

          ${{ inputs.voted_prompt }}

          ## Implementation summary

          EOF
          if [ -f .tmp/implementation-summary.md ]; then
            cat .tmp/implementation-summary.md >> "$body_file"
          else
            echo "Implementation summary was not written." >> "$body_file"
          fi
          cat >> "$body_file" <<'EOF'

          ## Merge policy

          Rank 1 is the default mainline candidate. Rank 2 and rank 3 are comparison candidates.
          EOF

          gh pr create \
            --title "Codex lab run for ${{ inputs.week }} rank ${{ inputs.candidate_rank }}" \
            --body-file "$body_file" \
            --base main \
            --head "codex-lab-${{ inputs.week }}-rank-${{ inputs.candidate_rank }}-${{ github.run_number }}"
