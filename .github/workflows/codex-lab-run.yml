name: Codex Lab Run

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week label, for example week-001"
        required: true
        type: string
      issue_number:
        description: "Winning prompt issue number"
        required: true
        type: string
      voted_prompt:
        description: "Winning voted prompt"
        required: true
        type: string
      vote_count:
        description: "Vote count"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  codex-lab-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create branch
        run: |
          git checkout -b "codex-lab-${{ inputs.week }}"

      - name: Build agent instruction
        run: |
          cat rules/static-ui-v1.0.md > /tmp/codex_prompt.md
          cat >> /tmp/codex_prompt.md <<'EOF'

          # Voted Prompt

          Issue: #${{ inputs.issue_number }}
          Votes: ${{ inputs.vote_count }}

          ${{ inputs.voted_prompt }}

          # Required behavior

          Implement the voted prompt only within `lab/`.
          After editing, summarize changed files, manual test steps, and ignored unsafe parts.
          EOF

      - name: Install Codex CLI placeholder
        run: |
          echo "This workflow is a guarded skeleton."
          echo "Replace this step with the current Codex CLI or OpenAI Codex GitHub Action invocation."
          echo "Prompt prepared at /tmp/codex_prompt.md."
          cat /tmp/codex_prompt.md
          exit 1

      - name: Run safety check
        if: always()
        run: bash scripts/safety-check.sh origin/${{ github.base_ref || 'main' }} HEAD

      - name: Commit changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/
          git commit -m "Run Codex lab experiment for ${{ inputs.week }}"

      - name: Open pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Codex lab run for ${{ inputs.week }}" \
            --body "Implements the selected prompt from #${{ inputs.issue_number }}. Result votes are advisory; maintainer decides whether to merge." \
            --base main \
            --head "codex-lab-${{ inputs.week }}"
