name: Generate HN Draft

on:
  workflow_dispatch:
    inputs:
      week_id:
        description: "Week id such as 001. Leave empty to infer from current date."
        required: false
        type: string
      site_url:
        description: "Submission URL candidate."
        required: false
        type: string
      commit_changes:
        description: "Commit generated HN draft. Default is false for manual dry-run safety."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  hn-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate HN draft
        env:
          WEEK_ID: ${{ github.event.inputs.week_id || '' }}
          SITE_URL: ${{ github.event.inputs.site_url || 'https://unjuno.github.io/prompt-vote-lab/' }}
          REPO_URL: https://github.com/Unjuno/prompt-vote-lab
        run: node scripts/create-hn-draft.mjs

      - name: Show generated diff
        run: |
          git status --short
          git diff -- reports/hn || true

      - name: Upload generated HN draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: hn-draft-dry-run
          path: reports/hn/**
          if-no-files-found: warn
          retention-days: 7

      - name: Commit HN draft
        if: github.event.inputs.commit_changes == 'true'
        run: |
          if git diff --quiet -- reports/hn; then
            echo "No HN draft changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hn
          git commit -m "Generate HN draft"
          git push
