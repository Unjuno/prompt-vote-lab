name: Codex Comparison Issue Run

on:
  workflow_dispatch:
    inputs:
      week_id:
        description: "Week id for the comparison output root, for example 2026-W20"
        required: true
        default: "2026-W20"
        type: string
      base_sha:
        description: "Fixed base commit SHA for all ranks in the comparison set"
        required: true
        type: string
      issue_number:
        description: "GitHub Issue number to run"
        required: true
        type: number
      candidate_rank:
        description: "Candidate rank: 1, 2, or 3"
        required: true
        type: number
      vote_count:
        description: "Vote count at selection time"
        required: true
        default: "0"
        type: number
  pull_request:
    branches:
      - main
    paths:
      - "run-requests/comparison/*.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-comparison-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  codex-comparison-issue-run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODEX_MODEL: gpt-5.4-nano
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_WEEK_ID: ${{ inputs.week_id }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
          DISPATCH_CANDIDATE_RANK: ${{ inputs.candidate_rank }}
          DISPATCH_VOTE_COUNT: ${{ inputs.vote_count }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/canary-diagnostics .tmp/workflow-tools
          cp scripts/normalize_comparison_rank_links.py .tmp/workflow-tools/normalize_comparison_rank_links.py
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_week="$DISPATCH_WEEK_ID"
            base_sha="$DISPATCH_BASE_SHA"
            issue_number="$DISPATCH_ISSUE_NUMBER"
            candidate_rank="$DISPATCH_CANDIDATE_RANK"
            vote_count="$DISPATCH_VOTE_COUNT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            python - <<'PY' > .tmp-comparison-inputs.env
          import json
          import os
          import subprocess
          from pathlib import Path
          base = os.environ.get('PR_BASE_SHA', '')
          head = os.environ.get('PR_HEAD_SHA', '')
          files = subprocess.check_output([
              'git', 'diff', '--name-only', base, head, '--', 'run-requests/comparison/*.json'
          ], text=True).splitlines()
          files = [name for name in files if name.startswith('run-requests/comparison/') and name.endswith('.json')]
          if len(files) != 1:
              raise SystemExit(f'exactly one comparison request JSON is required, got {files}')
          data = json.loads(Path(files[0]).read_text(encoding='utf-8'))
          required = ['week_id', 'base_sha', 'issue_number', 'candidate_rank', 'vote_count']
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f'missing comparison request keys: {missing}')
          print(f"RUN_WEEK={data['week_id']}")
          print(f"BASE_SHA={data['base_sha']}")
          print(f"ISSUE_NUMBER={data['issue_number']}")
          print(f"CANDIDATE_RANK={data['candidate_rank']}")
          print(f"VOTE_COUNT={data['vote_count']}")
          print(f"REQUEST_FILE={files[0]}")
          PY
            . ./.tmp-comparison-inputs.env
            run_week="$RUN_WEEK"
            base_sha="$BASE_SHA"
            issue_number="$ISSUE_NUMBER"
            candidate_rank="$CANDIDATE_RANK"
            vote_count="$VOTE_COUNT"
            printf '%s\n' "${REQUEST_FILE:-unknown}" > .tmp/canary-diagnostics/request-file.txt
          else
            echo "Unsupported event: $EVENT_NAME"
            exit 1
          fi

          case "$candidate_rank" in 1|2|3) ;; *) echo "candidate_rank must be 1, 2, or 3"; exit 1 ;; esac
          case "$vote_count" in ''|*[!0-9]*) echo "vote_count must be a non-negative integer"; exit 1 ;; *) ;; esac
          case "$run_week" in *[!A-Za-z0-9._-]*|'') echo "week_id contains unsupported characters"; exit 1 ;; *) ;; esac
          case "$issue_number" in ''|*[!0-9]*) echo "issue_number must be a positive integer"; exit 1 ;; *) ;; esac
          test -n "$base_sha"
          output_root="lab/comparisons/${run_week}/rank-${candidate_rank}"
          case "$output_root" in lab/comparisons/*/rank-1|lab/comparisons/*/rank-2|lab/comparisons/*/rank-3) ;; *) echo "invalid output root"; exit 1 ;; esac

          {
            echo "RUN_WEEK=$run_week"
            echo "BASE_SHA=$base_sha"
            echo "ISSUE_NUMBER=$issue_number"
            echo "CANDIDATE_RANK=$candidate_rank"
            echo "VOTE_COUNT=$vote_count"
            echo "OUTPUT_ROOT=$output_root"
          } >> "$GITHUB_ENV"

      - name: Checkout fixed comparison base
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA"
          git checkout "$BASE_SHA"

      - name: Fetch Issue and run safety gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/issue-source .tmp/issue-safety-runtime .tmp/issue-execution-gate .tmp/canary-diagnostics
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,url,author,createdAt,labels > .tmp/issue-source/selected-issue.raw.json
          cp .tmp/issue-source/selected-issue.raw.json .tmp/canary-diagnostics/source-issue.raw.json
          python scripts/scan_issue_safety.py --issue-json .tmp/issue-source/selected-issue.raw.json --phase runtime --out-json .tmp/issue-safety-runtime/scan.json --out-md .tmp/issue-safety-runtime/comment.md
          bash scripts/apply_issue_safety_feedback.sh --scan-json .tmp/issue-safety-runtime/scan.json --comment-md .tmp/issue-safety-runtime/comment.md --issue-number "$ISSUE_NUMBER"
          python scripts/check_issue_execution_gate.py --scan-json .tmp/issue-safety-runtime/scan.json --issue-json .tmp/issue-source/selected-issue.raw.json --out-json .tmp/issue-execution-gate/gate.json --out-md .tmp/issue-execution-gate/gate.md

      - name: Run existing fixed-Issue runner
        timeout-minutes: 20
        env:
          RUNNER_KEY: ${{ secrets.OPENAI_API_KEY_ }}
          ISSUE_JSON_PATH: .tmp/issue-source/selected-issue.raw.json
        run: |
          set -euo pipefail
          key_name="OPENAI_""API_KEY"
          export "$key_name=$RUNNER_KEY"
          bash scripts/run_codex_issue_instruction_canary.sh

      - name: Move root lab result into comparison output root
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT" .tmp/canary-diagnostics
          git status --short > .tmp/canary-diagnostics/git-status-before-rank-copy.txt
          git diff --name-only -- lab/index.html lab/style.css lab/app.js > .tmp/canary-diagnostics/root-lab-changed-files-before-rank-copy.txt
          git diff -- lab/index.html lab/style.css lab/app.js > .tmp/canary-diagnostics/root-lab-diff-before-rank-copy.patch || true
          cp lab/index.html "$OUTPUT_ROOT/index.html"
          cp lab/style.css "$OUTPUT_ROOT/style.css"
          cp lab/app.js "$OUTPUT_ROOT/app.js"
          python .tmp/workflow-tools/normalize_comparison_rank_links.py --index "$OUTPUT_ROOT/index.html" --week-id "$RUN_WEEK" --issue-number "$ISSUE_NUMBER" --candidate-rank "$CANDIDATE_RANK"
          git checkout -- lab/index.html lab/style.css lab/app.js
          git add -N "$OUTPUT_ROOT/index.html" "$OUTPUT_ROOT/style.css" "$OUTPUT_ROOT/app.js"
          printf '%s\n' "$BASE_SHA" > .tmp/canary-diagnostics/comparison-base-sha.txt
          printf '%s\n' "$OUTPUT_ROOT" > .tmp/canary-diagnostics/comparison-output-root.txt

      - name: Validate comparison output scope
        run: |
          set -euo pipefail
          mkdir -p .tmp/canary-diagnostics
          git status --short -- "$OUTPUT_ROOT" > .tmp/canary-diagnostics/rank-output-status.txt
          git diff --name-only -- "$OUTPUT_ROOT" > .tmp/canary-diagnostics/rank-output-changed-files.txt
          git diff --stat -- "$OUTPUT_ROOT" > .tmp/canary-diagnostics/rank-output-diff-stat.txt || true
          git diff -- "$OUTPUT_ROOT" > .tmp/canary-diagnostics/rank-output-diff.patch || true
          changed_files="$(git diff --name-only -- "$OUTPUT_ROOT")"
          if [ -z "$changed_files" ]; then
            echo "ERROR: comparison runner produced no rank output diff."
            echo "See rank-output-status.txt and root-lab-changed-files-before-rank-copy.txt."
            exit 1
          fi
          echo "$changed_files" | while read -r file; do
            case "$file" in "$OUTPUT_ROOT/index.html"|"$OUTPUT_ROOT/style.css"|"$OUTPUT_ROOT/app.js") ;; *) echo "Forbidden changed file: $file"; exit 1 ;; esac
          done
          bash scripts/safety-check.sh "$BASE_SHA" HEAD
          bash scripts/static-site-check.sh

      - name: Upload comparison diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-comparison-diagnostics-${{ github.run_number }}
          path: .tmp
          include-hidden-files: true
          if-no-files-found: warn

      - name: Commit comparison output and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="codex-comparison-${RUN_WEEK}-rank-${CANDIDATE_RANK}-${{ github.run_number }}"
          changed_files="$(git diff --name-only -- "$OUTPUT_ROOT" | paste -sd ', ' -)"
          issue_title="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.tmp/issue-source/selected-issue.raw.json').read_text(encoding='utf-8'))
          print(data.get('title', '').strip())
          PY
          )"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$OUTPUT_ROOT/index.html" "$OUTPUT_ROOT/style.css" "$OUTPUT_ROOT/app.js"
          git commit -m "Run Codex comparison issue rank $CANDIDATE_RANK"
          git push --set-upstream origin "$branch"
          cat > .tmp/comparison-pr-body.md <<EOF
          Implements a Prompt Vote Lab comparison candidate.

          ## Configuration

          - Week: $RUN_WEEK
          - Issue: #$ISSUE_NUMBER
          - Issue title: $issue_title
          - Rank: $CANDIDATE_RANK
          - Votes: $VOTE_COUNT
          - Fixed comparison base: \`$BASE_SHA\`
          - Output root: \`$OUTPUT_ROOT\`
          - Model: \`$CODEX_MODEL\`
          - Attempts: \`1\`
          - Retry policy: \`none\`
          - Fallback: \`none\`
          - Auto-merge: disabled
          - Final writable files: \`$OUTPUT_ROOT/index.html\`, \`$OUTPUT_ROOT/style.css\`, \`$OUTPUT_ROOT/app.js\`

          ## Changed files

          $changed_files

          ## Checks

          - runtime Issue safety scan passed
          - issue execution gate passed
          - root lab output copied into rank-specific comparison root
          - rank-root relative links normalized
          - rank-root issue/rank metadata normalized
          - root lab files restored before PR creation
          - changed-file guard passed
          - safety-check passed
          - static-site-check passed

          Manual review is required. Do not auto-merge.
          EOF
          gh pr create --title "Run Codex comparison issue rank $CANDIDATE_RANK" --body-file .tmp/comparison-pr-body.md --base main --head "$branch"
