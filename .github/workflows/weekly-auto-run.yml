name: Weekly Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: read

env:
  DEFAULT_NO_CHANGE_BASELINE: "20"
  DEFAULT_SUPPORT_USD: "0"
  AUTO_IMPLEMENTATION_MODEL: "gpt-5-nano"

concurrency:
  group: weekly-auto-run
  cancel-in-progress: false

jobs:
  weekly-auto-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare weekly variables
        run: |
          echo "RUN_WEEK=week-$(date -u +%G-W%V)" >> "$GITHUB_ENV"
          echo "NO_CHANGE_BASELINE=${PROMPT_VOTE_LAB_NO_CHANGE_BASELINE:-$DEFAULT_NO_CHANGE_BASELINE}" >> "$GITHUB_ENV"
          echo "SUPPORT_USD=${PROMPT_VOTE_LAB_SUPPORT_USD:-$DEFAULT_SUPPORT_USD}" >> "$GITHUB_ENV"
        env:
          PROMPT_VOTE_LAB_NO_CHANGE_BASELINE: ${{ vars.PROMPT_VOTE_LAB_NO_CHANGE_BASELINE }}
          PROMPT_VOTE_LAB_SUPPORT_USD: ${{ vars.PROMPT_VOTE_LAB_SUPPORT_USD }}

      - name: Collect prompt proposal votes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/collect_votes.py \
            --repo "${{ github.repository }}" \
            --week "$RUN_WEEK" \
            --out-dir .tmp \
            --no-change-baseline "$NO_CHANGE_BASELINE"

      - name: Determine eligible ranks
        run: |
          python scripts/select_eligible.py \
            --candidates .tmp/weekly-candidates.json \
            --support-usd "$SUPPORT_USD" \
            --out .tmp/eligible-candidates.json \
            --flag .tmp/has-eligible.txt \
            --meta .tmp/selection-meta.json

      - name: Export eligibility flag
        id: eligibility
        run: |
          has_eligible="$(cat .tmp/has-eligible.txt)"
          echo "has_eligible=${has_eligible}" >> "$GITHUB_OUTPUT"
          echo "HAS_ELIGIBLE=${has_eligible}" >> "$GITHUB_ENV"

      - name: Write weekly vote report
        run: |
          mkdir -p runs
          cp .tmp/weekly-vote-summary.md "runs/${RUN_WEEK}-vote-summary.md"
          {
            echo ""
            echo "## Weekly support total"
            echo ""
            echo "${SUPPORT_USD} USD"
            echo ""
            echo "## No-change baseline"
            echo ""
            echo "${NO_CHANGE_BASELINE} virtual votes"
            echo ""
            echo "## Eligible implementation ranks"
            echo ""
            python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('.tmp/eligible-candidates.json').read_text())
          if not items:
              print('- no implementation-agent attempt: no prompt beat the no-change baseline')
          for item in items:
              print(f"- rank {item['rank']}: issue #{item['issue_number']} ({item['run_reason']})")
          PY
            echo ""
            echo "## Selection metadata"
            echo ""
            echo '```json'
            cat .tmp/selection-meta.json
            echo '```'
          } >> "runs/${RUN_WEEK}-vote-summary.md"

      - name: Commit vote summary PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "weekly-auto-summary-${RUN_WEEK}-${{ github.run_number }}"
          git add "runs/${RUN_WEEK}-vote-summary.md"
          git commit -m "Record auto vote summary for ${RUN_WEEK}"
          git push --set-upstream origin "weekly-auto-summary-${RUN_WEEK}-${{ github.run_number }}"
          gh pr create \
            --title "Record auto vote summary for ${RUN_WEEK}" \
            --body "Automated weekly vote summary. This PR does not run the implementation agent." \
            --base main \
            --head "weekly-auto-summary-${RUN_WEEK}-${{ github.run_number }}"

      - name: Report no eligible implementation candidates
        if: ${{ steps.eligibility.outputs.has_eligible != 'true' }}
        run: |
          echo "No eligible candidates. No implementation-agent attempt will be made."

      - name: Require implementation secret only if candidates are eligible
        if: ${{ steps.eligibility.outputs.has_eligible == 'true' }}
        env:
          OPENAI_API_KEY_TRAILING: ${{ secrets.OPENAI_API_KEY_ }}
          OPENAI_API_KEY_PRIMARY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_IMPLEMENTATION: ${{ secrets.OPENAI_IMPLEMENTATION_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY_TRAILING}" ] && [ -z "${OPENAI_API_KEY_PRIMARY}" ] && [ -z "${OPENAI_API_KEY_IMPLEMENTATION}" ]; then
            echo "Eligible candidates exist, but no implementation-agent secret is configured."
            echo "Preferred secret name: OPENAI_API_KEY_"
            exit 1
          fi

      - name: Install Python dependency
        if: ${{ steps.eligibility.outputs.has_eligible == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Create implementation PRs for eligible candidates
        if: ${{ steps.eligibility.outputs.has_eligible == 'true' }}
        env:
          OPENAI_API_KEY_TRAILING: ${{ secrets.OPENAI_API_KEY_ }}
          OPENAI_API_KEY_PRIMARY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_IMPLEMENTATION: ${{ secrets.OPENAI_IMPLEMENTATION_API_KEY }}
          IMPLEMENTATION_MODEL: gpt-5-nano
          MAX_OUTPUT_TOKENS: "12000"
          GH_TOKEN: ${{ github.token }}
        run: |
          export OPENAI_API_KEY_="${OPENAI_API_KEY_TRAILING:-${OPENAI_API_KEY_PRIMARY:-$OPENAI_API_KEY_IMPLEMENTATION}}"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import os

          week = os.environ['RUN_WEEK']
          run_number = "${{ github.run_number }}"
          candidates = json.loads(Path('.tmp/eligible-candidates.json').read_text())
          if not candidates:
              print('No eligible candidates to implement')
              raise SystemExit(0)

          def sh(cmd):
              print('+', ' '.join(cmd))
              subprocess.run(cmd, check=True)

          base_sha = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()

          for item in candidates:
              rank = str(item['rank'])
              branch = f"codex-lab-{week}-rank-{rank}-{run_number}"
              issue = str(item['issue_number'])
              votes = str(item['vote_count'])
              prompt = item['body']
              reason = item.get('run_reason', 'normal-weekly-run')

              sh(['git', 'checkout', 'main'])
              sh(['git', 'checkout', '-B', branch])
              sh([
                  'python', 'scripts/openai_lab_run.py',
                  '--week', week,
                  '--candidate-rank', rank,
                  '--issue-number', issue,
                  '--voted-prompt', prompt,
                  '--vote-count', votes,
                  '--run-reason', reason,
              ])
              sh(['bash', 'scripts/safety-check.sh', 'origin/main', 'HEAD'])
              sh(['bash', 'scripts/static-site-check.sh'])
              diff = subprocess.run(['git', 'diff', '--quiet', '--', 'lab/'])
              if diff.returncode == 0:
                  raise SystemExit(f'Rank {rank} produced no lab changes')
              sh(['git', 'config', 'user.name', 'github-actions[bot]'])
              sh(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
              sh(['git', 'add', 'lab/'])
              sh(['git', 'commit', '-m', f'Run implementation agent for {week} rank {rank}'])
              sh(['git', 'push', '--set-upstream', 'origin', branch])

              body_path = Path(f'.tmp/pr-body-rank-{rank}.md')
              summary_path = Path('.tmp/implementation-summary.md')
              body = [
                  'Implements the selected ranked prompt candidate with the fixed implementation agent.',
                  '',
                  '## Candidate',
                  '',
                  f'- Week: {week}',
                  f'- Rank: {rank}',
                  f'- Issue: #{issue}',
                  f'- Votes: {votes}',
                  f'- Run reason: {reason}',
                  f'- Inherited lab base: `{base_sha}`',
                  '- Implementation model: `gpt-5-nano`',
                  '- Model policy: `rules/model-policy-v1.0.md`',
                  '- Agent-run policy: `rules/agent-run-policy-v1.0.md`',
                  '- Internal checks: `safety-check` and `static-site-check` passed before PR creation',
                  '- Created by: `Weekly Auto Run`',
                  '',
                  '## Selected prompt',
                  '',
                  prompt,
                  '',
                  '## Implementation summary',
                  '',
                  summary_path.read_text() if summary_path.exists() else 'Implementation summary was not written.',
                  '',
                  '## Merge policy',
                  '',
                  'Rank 1 is the default mainline candidate. Rank 2 and rank 3 are comparison candidates. Merge remains manual. Only merged PRs become the inherited lab state for later weeks.',
              ]
              body_path.write_text('\n'.join(body), encoding='utf-8')
              sh([
                  'gh', 'pr', 'create',
                  '--title', f'Agent lab run for {week} rank {rank}',
                  '--body-file', str(body_path),
                  '--base', 'main',
                  '--head', branch,
              ])
          PY
